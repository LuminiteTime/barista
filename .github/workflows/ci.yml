name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm pack && echo "RELEASE=release-${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE }}
          files: barista-*.tgz

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
